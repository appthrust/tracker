apiVersion: appthrust.io/v1alpha1
kind: ApplicationStackDefinition
metadata:
  name: tracker
spec:
  access:
    audiences:
    - appthrust-platform-api
    scopes:
    - openid
    - profile
    - email
    tokenClaims:
    - groups
    bearerPassThrough: true
    accessKeys:
      audience: tracker
      audienceEnv: TRACKER_ACCESS_AUDIENCE
      keyPrefix: trk
      scopes:
      - name: tracker:read
        description: Read issues, epics, comments, projects, sprints and views
      - name: tracker:write
        description: Create and edit issues, epics, comments, projects and sprints as the key's user
      defaultTTL: 720h0m0s
      maxTTL: 8760h0m0s
  components:
  - defaultValues:
      livenessProbePath: /healthz
      minScale: 1
      port: 8080
      publicURLEnv: TRACKER_PUBLIC_URL
      readinessProbePath: /readyz
    definitionRef:
      name: web-service
      version: v1
    id: web
  - defaultValues:
      provider: CNPG
      storageSize: 2Gi
    definitionRef:
      name: postgresql
      version: v1
    id: database
  connections:
  - from: web
    name: database
    to: database
  dependencies:
  - definition: directory
    installPolicy: Automatic
    publicURLEnv: TRACKER_DIRECTORY_PUBLIC_URL
    urlEnv: TRACKER_DIRECTORY_URL
  display:
    category: collaborate
    description: Report and track AppThrust defects and work items on a Linear-style,
      keyboard-first board.
    iconRef:
      name: tracker
    title: Issues
  publish:
    hostnameLabel: tracker
  releaseIdentityEnvPrefix: TRACKER
  updatePolicy:
    allowed:
    - pinned
    - follow
    default: follow
  versions: []
